<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Tileable backdrop: a quiet bullion-vault lattice in gold and red only.
       Kept at single-digit opacities so body text never loses contrast. -->
  <g stroke="#E3B341" stroke-opacity="0.035" stroke-width="1" fill="none">
    <path d="M0 0H160M0 80H160M0 0V160M80 0V160"/>
    <path d="M0 160L160 0"/>
  </g>
  <g stroke="#E3B341" stroke-opacity="0.05" stroke-width="1" fill="none">
    <path d="M24 20v8M24 34v8"/>
    <rect x="20" y="28" width="8" height="6"/>
    <path d="M120 112v8M120 126v8"/>
    <rect x="116" y="120" width="8" height="6"/>
  </g>
  <g stroke="#D8382F" stroke-opacity="0.04" stroke-width="1" fill="none">
    <path d="M64 56v8M64 106v8"/>
    <rect x="60" y="64" width="8" height="42"/>
  </g>
</svg>
