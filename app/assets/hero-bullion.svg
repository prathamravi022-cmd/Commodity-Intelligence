<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22161A"/>
      <stop offset="0.55" stop-color="#140E0E"/>
      <stop offset="1" stop-color="#0F0B0B"/>
    </linearGradient>
    <linearGradient id="hbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBCB6E"/>
      <stop offset="0.5" stop-color="#C9A236"/>
      <stop offset="1" stop-color="#8E6E1F"/>
    </linearGradient>
    <!-- Scrim: solid behind the headline copy, opening up over the bullion. -->
    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F0B0B" stop-opacity="0.97"/>
      <stop offset="0.46" stop-color="#0F0B0B" stop-opacity="0.86"/>
      <stop offset="0.66" stop-color="#0F0B0B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0F0B0B" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2E2022" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#hbg)"/>
